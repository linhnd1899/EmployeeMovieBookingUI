user nginx;
worker_processes auto;

pid /run/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections  4096;
}


http {
    
    index index.html index.htm;
    charset utf-8;
    
    ##
    # Security
    ##
    server_tokens off;
    autoindex off;
    client_max_body_size 32m;

    # Limit requests per IP address
    # limit_req_zone  $binary_remote_addr  zone=common:20m   rate=200r/s;
    # limit_req   zone=common  burst=300;

    ##
    # MIME
    ##
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    ##
    # Performance
    ##
    sendfile            on;
    sendfile_max_chunk  512k;
    
    tcp_nopush   on;
    tcp_nodelay  on;
    
    # use this only when your nginx server serves static files
    open_file_cache           max=1000 inactive=20s;
    open_file_cache_valid     30s;
    open_file_cache_min_uses  2;
    open_file_cache_errors    off;
    
    ##
    # SSL
    ##
    ssl_protocols             TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_timeout       10m;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    # Don't forget to set `ssl_trusted_certificate` to the chain of your cert in the `server` block.
    ssl_prefer_server_ciphers on;
    
    ##
    # GZIP
    ##
    gzip               on;
    gzip_disable       msie6;
    gzip_vary          on;
    gzip_proxied       any;
    # gzip_http_version  1.0;  # uncomment this to allow gzipping responses on http/1.0. proxy_pass uses http/1.0
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    # uncomment this if you want to provide nginx already gzipped variants of files, like `${file}.gz` 
    # gzip_static on;

    server {
        listen 80;

        ##
        # Security Headers
        ##
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.ckeditor.com; style-src 'self' 'unsafe-inline' https://cdn.ckeditor.com; img-src 'self' data: https://cdn.ckeditor.com https://*.gravatar.com https://cdn.auth0.com https://*.wp.com; font-src 'self' data:; connect-src 'self' https://*.us.auth0.com https://*.spatialbiz.com https://*.spatialbiz.net https://*.ckeditor.com; frame-src 'self' https://*.us.auth0.com https://d2jb2z9yznlc57.cloudfront.net https://docs.spatialbiz.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html =404;
        }
        location /manage {
            root /usr/share/nginx/html;
            rewrite ^/manage$ / break;
            rewrite ^/manage(/.*) $1 break;  
            try_files $uri /index.html =404;
        }
    }
}
